name: Version Consistency Check

on:
    pull_request:
        branches:
            - "**"
    workflow_dispatch:

jobs:
    version-check:
        name: Verify version consistency
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Run version consistency check
              run: npm run version:check
